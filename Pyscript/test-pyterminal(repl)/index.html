<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pyscript terminal test</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
</head>
<body>

    <h2>PyScript Terminal test</h2>
    <py-terminal></py-terminal>

    <script id="python-terminal" type="mpy" terminal>
        import code

        code.interact()
    </script>

    <h2>Pyscript py-editor test</h2>

    <script type="py-editor"  auto-generate="true">
        import sys
        print(sys.version)
    </script>

</body>
</html>
