<!DOCTYPE html>
<html>
<head>
    <title>PyScript test</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
</head>
<body>
    
    <h1 id="hello"></h1>
    
    <h2 id="output-area"></h2>

    <py-script>
        import datetime
        import time
        from pyscript import display

        epoch_seconds = time.time()

        dt = datetime.datetime.fromtimestamp(epoch_seconds)

        display(dt.strftime('%Y/%m/%d %H:%M:%S'), target="output-area")
        display("hello,world!",target="hello")
    </py-script>
</body>
</html>
